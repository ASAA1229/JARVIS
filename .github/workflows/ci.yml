name: JARVIS CI

on:
  push:
    branches: [test, fix, new, dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript build
        run: npm run build
      - name: TypeScript check
        run: npm run lint
      - name: Automated test suite
        run: npm test
      - name: Browser security smoke test
        run: npm run test:browser
