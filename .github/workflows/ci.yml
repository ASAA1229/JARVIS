name: JARVIS CI

on:
  # Avoid an email-producing workflow run for every small implementation commit.
  # Run manually during development, and automatically for reviewable PRs into dev.
  workflow_dispatch:
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: jarvis-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency security audit
        run: npm audit --audit-level=moderate
      - name: TypeScript build
        run: npm run build
      - name: Create and verify SHA-256 build manifest
        run: |
          tar -czf jarvis-build.tar.gz -C dist .
          node scripts/artifact-integrity.mjs create dist jarvis-manifest.json jarvis-build.tar.gz
          node scripts/artifact-integrity.mjs verify dist jarvis-manifest.json jarvis-build.tar.gz
          node scripts/artifact-integrity.mjs hash jarvis-build.tar.gz jarvis-build.tar.gz.sha256
          node scripts/artifact-integrity.mjs verify-hash jarvis-build.tar.gz jarvis-build.tar.gz.sha256
      - name: Upload verified build package and provenance
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-build-${{ github.run_number }}
          path: |
            jarvis-build.tar.gz
            jarvis-manifest.json
            jarvis-build.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: TypeScript check
        run: npm run lint
      - name: Automated test suite
        run: npm test
      - name: Browser security smoke test
        run: npm run test:browser

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Assemble native Android companion
        run: gradle -p android-app :app:assembleDebug
      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-companion-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
