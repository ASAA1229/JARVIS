name: JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: [new]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: jarvis-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Assemble installable debug APK
        run: gradle -p android-app :app:assembleDebug
      - name: Create checksum and build metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK" > app-debug.apk.sha256
          {
            echo "Repository: ${GITHUB_REPOSITORY}"
            echo "Branch: ${GITHUB_REF_NAME}"
            echo "Commit: ${GITHUB_SHA}"
            echo "Variant: debug"
            echo "Application ID: com.jarvis.companion"
            echo "Version: 0.1.0 (versionCode 1)"
            echo "APK SHA-256:"
            cut -d ' ' -f 1 app-debug.apk.sha256
            echo "Note: debug-signed internal testing package; not a production release."
          } > android-apk-build.txt
      - name: Publish APK package
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug-${{ github.run_number }}-${{ github.sha }}
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            android-apk-build.txt
          if-no-files-found: error
          retention-days: 30
